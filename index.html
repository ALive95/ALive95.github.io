<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabellone Serie A</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314532D'/%3E%3Cg stroke='%23fff' stroke-width='2' fill='none'%3E%3Cpath d='M16 3v26'/%3E%3Ccircle cx='16' cy='16' r='6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --carta:#F7F6F2; --inchiostro:#17211B; --grigio:#6B7570; --linea:#DDDCD4;
  --prato:#1E7A45; --prato-scuro:#14532D; --card:#FFFFFF;
  --live:#D3382C; --pen:#C79A00; --giallo:#F5C518; --rosso:#D3382C;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--carta);color:var(--inchiostro);font-size:15px;line-height:1.45;padding-bottom:30px}

.top{position:sticky;top:0;z-index:20}
header{background:var(--prato-scuro);color:#fff;padding:13px 16px 11px}
header h1{font-family:'Archivo Expanded',sans-serif;font-weight:800;font-size:19px;letter-spacing:.02em;text-transform:uppercase}
header h1 span{color:#8FD9AC}
.statusbar{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#A9C7B4;margin-top:3px}
.switch{margin-left:auto;display:flex;gap:5px}
.switch button{font:inherit;cursor:pointer;background:transparent;-webkit-appearance:none;appearance:none}
.switch a,.switch button{font-family:'Barlow Condensed',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#A9C7B4;text-decoration:none;padding:2px 10px;border:1px solid rgba(255,255,255,.25);border-radius:20px;white-space:nowrap}
.switch a.on{background:#fff;color:var(--prato-scuro);border-color:#fff}
.pitchline{height:3px;background:repeating-linear-gradient(90deg,var(--prato) 0 24px,#2b9a5c 24px 48px)}

/* tema scuro */
body.dark{--carta:#0E1512;--inchiostro:#E7EDE8;--grigio:#93A09A;--linea:#26302B;--card:#151E19}
body.dark .rbtn,body.dark .vbtn{background:var(--card)}
body.dark .rbtn.sel,body.dark .vbtn.sel{background:var(--prato);border-color:var(--prato);color:#06140C}
body.dark .score,body.dark .actions a,body.dark .actions button{background:#1E2823}
body.dark .match.live .score{background:#3A1E1A;color:#FF8C7C}
body.dark .tab th{background:#111A16}
body.dark .errbar{background:#3A3115;color:#EBCB74}
body.dark .ev .txt .min,
body.dark .lu h4,
body.dark .lu .subs .sub .min,
body.dark .roundtitle,
body.dark .rbtn.cur,
body.dark .actions a,
body.dark .actions button{color:#8FD9AC}
body.dark .actions button:disabled{color:var(--linea)}

/* selettore delle viste */
.views{background:var(--carta);display:flex;gap:6px;padding:8px 12px 0;max-width:640px;margin:0 auto}
.vbtn{flex:1 1 0;height:32px;border-radius:9px;border:1px solid var(--linea);background:#fff;color:var(--grigio);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.vbtn.sel{background:var(--prato-scuro);border-color:var(--prato-scuro);color:#fff}

.roundtitle{font-family:'Archivo Expanded',sans-serif;font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;color:var(--prato-scuro);margin:2px 4px 10px}
/* tabelle: classifica e marcatori */
.tab{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--linea);border-radius:14px;overflow:hidden;margin-bottom:10px}
.tab th{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--grigio);text-align:right;padding:9px 5px;line-height:1.15;border-bottom:1px solid var(--linea);background:var(--carta)}
.tab td{padding:10px 5px;font-size:15px;text-align:right;border-bottom:1px solid var(--linea)}
.tab td.l{font-size:14.5px}
.tab tr:last-child td{border-bottom:0}
.tab th.l,.tab td.l{text-align:left}
.tab td.pos{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;color:var(--grigio);width:28px;padding-right:2px}
.tab td.big{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px}
.tab td.sq{font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--grigio);white-space:nowrap}
.tab .tlogo{width:24px;height:24px;object-fit:contain;vertical-align:-7px;margin-right:7px}
.tab tr.cut td{border-bottom:2px solid var(--prato-scuro)}
.tabnote{color:var(--grigio);font-size:12.5px;line-height:1.4;margin:0 4px 16px}

/* barra delle giornate */
.rounds{background:var(--carta);border-bottom:1px solid var(--linea);display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.rounds::-webkit-scrollbar{display:none}
.rbtn{flex:0 0 auto;min-width:34px;height:34px;padding:0 4px;border-radius:9px;border:1px solid var(--linea);background:#fff;color:var(--grigio);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;cursor:pointer}
.rbtn.cur{border-color:var(--prato);color:var(--prato-scuro)}
.rbtn.sel{background:var(--prato-scuro);border-color:var(--prato-scuro);color:#fff}
@media (min-width:760px){
  .rounds{flex-wrap:wrap;overflow-x:visible;justify-content:center;gap:5px;max-width:760px;margin:0 auto}
  .rbtn{min-width:30px;height:30px;font-size:15px}
}

main{padding:14px 12px 20px;max-width:640px;margin:0 auto}
.group-label{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);margin:14px 4px 8px}
.group-label:first-child{margin-top:2px}

.match{background:var(--card);border:1px solid var(--linea);border-radius:14px;margin-bottom:10px;overflow:hidden}
.mhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px 14px 6px}
.team{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;line-height:1.1;display:flex;align-items:center;gap:7px}
.team.h{justify-content:flex-end}
.team .tlogo{width:27px;height:27px;object-fit:contain;flex:0 0 auto}
.score{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:.02em;min-width:64px;text-align:center;padding:2px 6px;border-radius:8px;background:#F2F1EC}
.match.live .score{background:#FBEAE8;color:var(--live)}
.badge{display:block;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:3px;color:var(--grigio)}
.match.live .badge{color:var(--live)}
.match.live .badge::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:5px;vertical-align:middle;animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.when{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.03em;color:var(--grigio);padding:0 14px 10px}

/* eventi: gol e cartellini, divisi casa (sx) / ospite (dx) */
.events{border-top:1px dashed var(--linea);padding:9px 14px 10px;display:grid;grid-template-columns:1fr 1fr;gap:3px 12px}
.ev{font-size:14px;display:flex;align-items:baseline;gap:6px}
.ev.away{grid-column:2;flex-direction:row-reverse;text-align:right}
.ev.home{grid-column:1}
.ev .ic{flex:0 0 auto;font-size:13px;line-height:1}
.ev .card{display:inline-block;width:10px;height:13px;border-radius:2px;transform:translateY(1px)}
.ev .card.yellow{background:var(--giallo)}
.ev .card.red{background:var(--rosso)}
.ev .txt .min{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--prato-scuro)}
.ev .txt .ast{display:block;font-size:12px;line-height:1.3;color:var(--grigio)}
.ev.card-red .txt .min,.ev.card-yellow .txt .min{color:var(--grigio)}
.noyet{color:var(--grigio);font-size:13px;padding:2px 0;grid-column:1 / -1}
.ko{color:var(--grigio);font-size:13px;text-align:center;padding-top:2px;grid-column:1 / -1}

/* azioni: link + toggle formazioni */
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px solid var(--linea);padding:9px 14px}
.actions a,.actions button{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--prato-scuro);background:#F2F1EC;border:1px solid var(--linea);border-radius:20px;padding:4px 12px;text-decoration:none;cursor:pointer}
.actions button:disabled{color:var(--linea);cursor:default}
.actions .grow{margin-left:auto}

.lineups{border-top:1px dashed var(--linea);padding:11px 14px 13px;display:none;grid-template-columns:1fr 1fr;gap:14px}
.lineups.open{display:grid}
.lu h4{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--prato-scuro);margin-bottom:5px}
.lu h4 span{color:var(--grigio);font-weight:600}
.lu .p{font-size:13px;line-height:1.5}
.lu .p b{font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--grigio);display:inline-block;min-width:20px}
.lu .bench{margin-top:6px;color:var(--grigio);font-size:12.5px;line-height:1.5}
.lu .bench .bt{text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;font-weight:700;display:block;margin-bottom:2px}
.lu .subs{margin-top:6px;font-size:12.5px;line-height:1.55}
.lu .subs .bt{text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;font-weight:700;color:var(--grigio);display:block;margin-bottom:2px}
.lu .subs .sub .min{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--prato-scuro);margin-right:4px}
.lu .subs .sub .out{color:var(--grigio)}

.msg{text-align:center;color:var(--grigio);padding:40px 16px;font-size:14px}
.spin{width:26px;height:26px;border:3px solid var(--linea);border-top-color:var(--prato);border-radius:50%;margin:0 auto 12px;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.errbar{background:#FDF3D7;color:#8A6A06;font-size:12.5px;text-align:center;padding:7px 12px}
</style>
</head>
<body>
<div class="top">
  <header>
    <h1>Tabellone <span>Serie A</span></h1>
    <div class="statusbar"><span id="clock">—</span>
      <nav class="switch">
        <button id="theme" onclick="toggleTheme()">Scuro</button>
        <a href="index.html" class="on">Serie A</a>
        <a href="champions.html">Champions</a>
      </nav>
    </div>
  </header>
  <div class="pitchline"></div>
  <nav class="views" id="views"></nav>
  <nav class="rounds" id="rounds"></nav>
</div>
<div id="errbar" class="errbar" style="display:none"></div>

<main id="app">
  <div class="msg"><div class="spin"></div>Carico la stagione…</div>
</main>

<script>
/* ============================================================================
   Pagina autosufficiente: legge direttamente da ESPN (endpoint pubblico non
   ufficiale) dal browser di chi guarda — l'unico canale che ESPN non blocca.
   All'avvio scarica tutte le partite della stagione e le raggruppa in giornate
   (ogni squadra gioca una volta per giornata: quando una si ripete, è iniziata
   la giornata dopo). Aprendo una giornata scarica il "summary" di ogni partita
   per gol, cartellini e formazioni. Nessun file esterno, nessun Worker.
============================================================================ */
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1';
const TOTAL_ROUNDS_DEFAULT = 38;
const REFRESH_SECONDS = 60;

const app = document.getElementById('app');
const clock = document.getElementById('clock');
const errbar = document.getElementById('errbar');
const roundsBar = document.getElementById('rounds');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pad2 = n => String(n).padStart(2,'0');

const GROUPS = [['live','In corso'],['finished','Finite'],['upcoming','Da giocare']];
const GTAG = {penalty:'rig.', own:'aut.'};

let ROUNDS = {};        // { n: [eventi scoreboard] }
let CURRENT = 1;        // giornata corrente
let SELECTED = null;    // giornata mostrata
const cache = {};       // id partita -> { events, lineups } dal summary

/* ---------- formattazione ------------------------------------------------- */
// particelle che fanno parte del cognome (De Rossi, Di Lorenzo, van Dijk...)
const NAME_PARTICLES = new Set(['de','di','da','del','della','dei','degli','van','von','der','den','dos','das','la','le','lo','du',"d'","o'",'mc','mac','ten','ter','al','el']);
// restituisce il nome con il cognome in <strong>
function boldSurname(name){
  const s = String(name||'').trim();
  if(!s) return '';
  const parts = s.split(/\s+/);
  if(parts.length===1) return `<strong>${esc(s)}</strong>`;
  let i = parts.length-1;
  while(i>0 && NAME_PARTICLES.has(parts[i-1].toLowerCase())) i--;
  const first = parts.slice(0,i).join(' '), last = parts.slice(i).join(' ');
  return (first?esc(first)+' ':'') + `<strong>${esc(last)}</strong>`;
}

function whenLabel(iso){
  if(!iso) return 'Data da definire';
  const d = new Date(iso);
  const day = d.toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'short'});
  const hm  = d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  return day + ' · ' + hm;
}

/* ---------- riga evento (gol o cartellino) -------------------------------- */
function eventRow(e){
  const min = e.minute!=null ? e.minute+"'" : '';
  let ic, extra='';
  if(e.type==='yellow'){ ic = `<span class="card yellow"></span>`; extra=' card-yellow'; }
  else if(e.type==='red'){ ic = `<span class="card red"></span>`; extra=' card-red'; }
  else { ic = '\u26BD'; }  // pallone per i gol
  const tag = GTAG[e.type] ? ', '+GTAG[e.type] : '';
  const ast = e.assist ? `<span class="ast">assist ${boldSurname(e.assist)}</span>` : '';
  const txt = `<span class="txt">${boldSurname(e.player)} <span class="min">(${min}${tag})</span>${ast}</span>`;
  return `<div class="ev ${e.team}${extra}"><span class="ic">${ic}</span>${txt}</div>`;
}

/* ---------- formazioni ---------------------------------------------------- */
function sideLineup(side, l){
  if(!l) return '';
  const start = (l.start||[]).map(p=>`<div class="p"><b>${esc(p.n||'')}</b> ${boldSurname(p.name)}</div>`).join('');
  const bench = (l.bench||[]).map(p=>boldSurname(p)).join(', ');
  const subs = (l.subs||[]).map(s=>{
    const m = s.minute!=null ? s.minute+"'" : '';
    return `<div class="sub"><span class="min">${m}</span>${boldSurname(s.in)}${s.out?` <span class="out">(esce ${boldSurname(s.out)})</span>`:''}</div>`;
  }).join('');
  return `<div class="lu">
    <h4>${esc(side)} <span>${esc(l.formation||'')}</span></h4>
    ${start}
    ${bench?`<div class="bench"><span class="bt">Panchina</span>${bench}</div>`:''}
    ${subs?`<div class="subs"><span class="bt">Cambi</span>${subs}</div>`:''}
  </div>`;
}

/* ---------- card partita -------------------------------------------------- */
function matchCard(m){
  const badge = m.status==='live' ? (m.clock || 'Live')
             : m.status==='finished' ? 'Finita' : 'Da giocare';

  let body;
  if(m.status==='upcoming'){
    body = `<div class="events"><div class="ko">Calcio d'inizio ${m.kickoff?whenLabel(m.kickoff):'da definire'}</div></div>`;
  } else {
    const evs = m.events||[];
    body = evs.length
      ? `<div class="events">${evs.map(eventRow).join('')}</div>`
      : `<div class="events"><div class="noyet">Nessun gol o cartellino.</div></div>`;
  }

  const espn = m.espn ? `<a href="${esc(m.espn)}" target="_blank" rel="noopener">ESPN</a>` : '';
  const hasLine = m.lineups && (m.lineups.home || m.lineups.away);
  const lineBtn = `<button class="grow" onclick="toggleLineups('${esc(m.id)}')" ${hasLine?'':'disabled'}>Formazioni</button>`;
  const lineBox = hasLine
    ? `<div class="lineups" id="lu-${esc(m.id)}">${sideLineup(m.home,m.lineups.home)}${sideLineup(m.away,m.lineups.away)}</div>`
    : '';

  return `<div class="match ${m.status}">
    <div class="mhead">
      <div class="team h"><span>${esc(m.home)}</span>${m.homeLogo?`<img class="tlogo" src="${esc(m.homeLogo)}" alt="" loading="lazy">`:''}</div>
      <div><div class="score">${m.homeScore??0}&ndash;${m.awayScore??0}</div><span class="badge">${badge}</span></div>
      <div class="team">${m.awayLogo?`<img class="tlogo" src="${esc(m.awayLogo)}" alt="" loading="lazy">`:''}<span>${esc(m.away)}</span></div>
    </div>
    <div class="when">${whenLabel(m.kickoff)}</div>
    ${body}
    <div class="actions">
      ${espn}
      ${lineBtn}
    </div>
    ${lineBox}
  </div>`;
}

function toggleLineups(id){
  const el = document.getElementById('lu-'+id);
  if(el) el.classList.toggle('open');
}

/* ---------- barra giornate ------------------------------------------------ */
function buildRoundsBar(){
  const total = Object.keys(ROUNDS).length || TOTAL_ROUNDS_DEFAULT;
  let html = '';
  for(let n=1;n<=total;n++){
    const cls = 'rbtn' + (n===CURRENT?' cur':'') + (n===SELECTED?' sel':'');
    html += `<button class="${cls}" onclick="selectRound(${n})">${n}</button>`;
  }
  roundsBar.innerHTML = html;
  const selBtn = roundsBar.querySelector('.rbtn.sel');
  if(selBtn && roundsBar.scrollWidth > roundsBar.clientWidth)
    selBtn.scrollIntoView({inline:'center',block:'nearest'});
}

/* ---------- rendering ----------------------------------------------------- */
function sortMatches(m){
  const rank = {live:0, finished:1, upcoming:2};
  return m.slice().sort((a,b) =>
    (rank[a.status]-rank[b.status]) ||
    ((a.kickoff||'') < (b.kickoff||'') ? -1 : 1));
}

function render(matches){
  const ms = sortMatches(matches||[]);
  if(!ms.length){ app.innerHTML = `<div class="msg">Nessuna partita in questa giornata.</div>`; return; }
  let html = '';
  for(const [key,label] of GROUPS){
    const g = ms.filter(m=>m.status===key);
    if(!g.length) continue;
    html += `<div class="group-label">${label}</div>` + g.map(matchCard).join('');
  }
  app.innerHTML = html;
}

/* ---------- lettura da ESPN ---------------------------------------------- */
// ESPN (da settembre 2026) rifiuta con HTTP 400 gli intervalli "AAAAMMGG-AAAAMMGG".
// Accetta l'anno intero (dates=AAAA) e il giorno singolo (dates=AAAAMMGG):
// si prova per anni, e se la risposta sembra troncata si scende ai singoli giorni.
const YEAR_LIMIT = 1000;
const PARALLEL = 4;
const ymd = d => ''+d.getUTCFullYear()+pad2(d.getUTCMonth()+1)+pad2(d.getUTCDate());

// una richiesta per valore di dates, PARALLEL alla volta, con un secondo tentativo
async function fetchDates(list, query){
  const get = v => fetch(ESPN+'/scoreboard?'+query+'dates='+v,{cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(j=>({ok:true, events:j.events||[]}));
  const out = [];
  for(let i=0;i<list.length;i+=PARALLEL){
    const part = await Promise.all(list.slice(i,i+PARALLEL).map(v =>
      get(v).catch(()=>get(v)).catch(()=>({ok:false, events:[]}))));
    out.push(...part);
  }
  return out;
}

// giorni di gioco dal calendario ESPN; se non e' un elenco di date, tutti i giorni fra start e end
function seasonDays(lg, start, end, parse){
  let days = (lg.calendar||[]).filter(c=>typeof c==='string').map(parse)
    .filter(d => !isNaN(d) && d >= start && d <= end);
  if(days.length < 2){ days = []; for(let t=start.getTime(); t<=end.getTime(); t+=864e5) days.push(new Date(t)); }
  return days.sort((a,b)=>a-b);
}

async function seasonEvents(lg, start, end, parse, query){
  const years = [];
  for(let y=start.getUTCFullYear(); y<=end.getUTCFullYear(); y++) years.push(String(y));
  const byYear = await fetchDates(years, 'limit='+YEAR_LIMIT+'&');
  // 100 e' il limite predefinito di ESPN: se esce esattamente 100, il parametro limit e' stato ignorato
  if(byYear.every(d => d.ok && d.events.length < YEAR_LIMIT && d.events.length !== 100)) return byYear;
  return fetchDates(seasonDays(lg, start, end, parse).map(ymd), query);
}

// tutte le partite della stagione, raggruppate in giornate
async function fetchSeason(){
  const board = await fetch(ESPN+'/scoreboard?_='+Date.now(),{cache:'no-store'}).then(r=>{
    if(!r.ok) throw new Error('HTTP '+r.status); return r.json();
  });
  const lg = board.leagues[0];
  const parse = s => new Date(Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10)));
  const start = parse(lg.season.startDate), end = parse(lg.season.endDate);

  const results = await seasonEvents(lg, start, end, parse, '');

  const seen = new Set(), events = [];
  const endT = end.getTime() + 864e5;         // le query per anno portano anche partite di altre stagioni
  const inSeason = ev => !ev.date || (new Date(ev.date) >= start && new Date(ev.date).getTime() < endT);
  const addEvents = list => { for(const ev of (list||[])) if(!seen.has(ev.id) && inSeason(ev)){ seen.add(ev.id); events.push(ev); } };
  addEvents(board.events);                 // "oggi" fresco: ha precedenza sui blocchi stagionali in cache
  for(const d of results) addEvents(d.events);
  events.sort((a,b)=>((a.date||'') < (b.date||'') ? -1 : 1));

  ROUNDS = groupRounds(events);
  CURRENT = currentRoundOf(ROUNDS);
}

function groupRounds(events){
  const rounds = {}; let cur = [], seen = new Set(), n = 1;
  for(const ev of events){
    const ids = ev.competitions[0].competitors.map(c=>c.id);
    if(ids.some(id=>seen.has(id))){ rounds[n]=cur; n++; cur=[]; seen=new Set(); }
    cur.push(ev); ids.forEach(id=>seen.add(id));
  }
  if(cur.length) rounds[n]=cur;
  return rounds;
}

function currentRoundOf(rounds){
  const now = Date.now(); let cur = 1;
  for(const n of Object.keys(rounds).map(Number).sort((a,b)=>a-b)){
    const first = rounds[n].map(e=>e.date).filter(Boolean).sort()[0];
    if(first && new Date(first).getTime() <= now) cur = n;
  }
  return cur;
}

// gol, cartellini e formazioni dal summary di una partita
// chi ha servito l'assist: prima dal commento, poi dal secondo partecipante
// dell'azione. Niente assist su rigori e autogol.
function assistOf(d, text, scorer){
  let a = null;
  const m = String(text||'').match(/assist(?:ed by|:)\s+([^.,;(]+)/i);
  // il commento continua con 'with a through ball', 'after a corner'...: taglio li'
  if(m) a = m[1].replace(/\s+(with|after|following|from)\b.*$/i,'');
  if(!a){
    const chi = atletiDi(d);
    a = (chi[1] && (chi[1].displayName || chi[1].fullName)) || null;
  }
  if(!a) return null;
  a = String(a).replace(/\s+/g,' ').trim();
  if(!a || a.toLowerCase() === String(scorer||'').toLowerCase()) return null;
  return a;
}

function extractFromSummary(sm, homeId){
  const events = []; let lineups = null;
  const side = id => String(id) === String(homeId) ? 'home' : 'away';
  const minOf = o => { const c=(o.clock&&o.clock.displayValue)||''; const m=String(c).match(/\d+/); return m?+m[0]:null; };

  // testo del commento di ogni gol: da li' si legge l'assist ("Assisted by ...")
  const goalText = {};
  for(const k of (sm.keyEvents || [])){
    if(!k.text || !/goal/i.test((k.type&&k.type.text)||'')) continue;
    goalText[minOf(k)+'|'+((k.team&&k.team.id)||'')] = k.text;
  }
  for(const d of (sm?.header?.competitions?.[0]?.details || [])){
    if(!d.scoringPlay) continue;
    const min = minOf(d), team = (d.team&&d.team.id)||'';
    const chi = atletiDi(d);
    const player = (chi[0] && (chi[0].displayName || chi[0].fullName)) || '—';
    const type = d.penaltyKick?'penalty':d.ownGoal?'own':'goal';
    events.push({ minute:min, team:side(team), player, type,
      assist: type==='goal' ? assistOf(d, d.text || goalText[min+'|'+team], player) : null });
  }
  for(const k of (sm.keyEvents || [])){
    const t = (k.type&&k.type.text)||'';
    const type = t.includes('Yellow Card') ? 'yellow' : t.includes('Red Card') ? 'red' : null;
    if(!type) continue;
    events.push({ minute:minOf(k), team:side(k.team&&k.team.id),
      player:(k.participants&&k.participants[0]&&k.participants[0].athlete&&k.participants[0].athlete.displayName)||'—', type });
  }
  events.sort((a,b)=>(a.minute||0)-(b.minute||0));

  // sostituzioni: assunzione participants[0]=entra, participants[1]=esce
  const subs = [];
  for(const k of (sm.keyEvents || [])){
    if(!/substitution/i.test((k.type&&k.type.text)||'')) continue;
    const names = (k.participants||[]).map(p=>p.athlete&&p.athlete.displayName).filter(Boolean);
    subs.push({ minute:minOf(k), team:side(k.team&&k.team.id), in:names[0]||'', out:names[1]||'' });
  }
  subs.sort((a,b)=>(a.minute||0)-(b.minute||0));

  if((sm.rosters||[]).length){
    lineups = {};
    for(const r of sm.rosters){
      const s = r.homeAway==='home' ? 'home' : 'away';
      const start = [], bench = [];
      for(const p of (r.roster||[])){
        const name = (p.athlete&&p.athlete.displayName)||'';
        if(p.starter) start.push({ n:p.jersey||'', name, o:+(p.formationPlace||99) });
        else bench.push(name);
      }
      start.sort((a,b)=>a.o-b.o);
      lineups[s] = { formation:r.formation||'', start, bench, subs:subs.filter(x=>x.team===s) };
    }
  }
  return { events, lineups };
}

// costruisce l'oggetto partita per il rendering
async function buildMatch(ev){
  const cs = ev.competitions[0].competitors;
  const home = cs.find(c=>c.homeAway==='home') || cs[0];
  const away = cs.find(c=>c.homeAway==='away') || cs[1];
  const state = ev.status && ev.status.type && ev.status.type.state;   // pre | in | post
  const status = state==='in' ? 'live' : state==='post' ? 'finished' : 'upcoming';
  let clock = '';
  if(status==='live'){
    const st = ev.status||{}, t = st.type||{};
    if((t.name||'')==='STATUS_HALFTIME' || /halftime|intervallo/i.test(t.description||''))
      clock = 'Intervallo';
    else
      clock = String(st.displayClock || t.shortDetail || '').trim();
  }
  const nameOf = c => c.team.shortDisplayName || c.team.name || '?';
  const scoreOf = c => { const n = parseInt(c.score,10); return Number.isFinite(n)?n:0; };
  const logoOf = c => (c.team && (c.team.logo || (c.team.logos && c.team.logos[0] && c.team.logos[0].href))) || '';

  let events = [], lineups = null;
  if(status !== 'upcoming'){
    if(!cache[ev.id]){
      const sm = await fetch(ESPN+'/summary?event='+ev.id).then(r=>r.ok?r.json():null).catch(()=>null);
      cache[ev.id] = sm ? extractFromSummary(sm, home.id) : { events:[], lineups:null };
    }
    ({ events, lineups } = cache[ev.id]);
  }
  return { id:ev.id, status, clock, home:nameOf(home), away:nameOf(away),
    homeLogo:logoOf(home), awayLogo:logoOf(away),
    homeScore:scoreOf(home), awayScore:scoreOf(away), kickoff:ev.date||null,
    events, lineups, espn:'https://www.espn.com/soccer/match/_/gameId/'+ev.id };
}

async function selectRound(n){
  SELECTED = n; buildRoundsBar();
  app.innerHTML = `<div class="msg"><div class="spin"></div>Carico la giornata ${n}…</div>`;
  const evs = ROUNDS[n] || [];
  if(!evs.length){ app.innerHTML = `<div class="msg">Giornata ${n} non disponibile.</div>`; return; }
  const matches = await Promise.all(evs.map(buildMatch));
  render(matches);
  stamp();
}

// aggiorna solo la giornata corrente (se la stai guardando)
async function refreshCurrent(){
  const evs = ROUNDS[CURRENT] || [];
  const dates = evs.map(e=>e.date).filter(Boolean).sort();
  if(!dates.length) return;
  const days = [...new Set(dates.map(iso=>ymd(new Date(iso))))];
  try{
    const res = await fetchDates(days, '_='+Date.now()+'&');
    const all = res.flatMap(d=>d.events||[]);
    if(all.length){
      const byId = {}; all.forEach(e=>byId[e.id]=e);
      ROUNDS[CURRENT] = evs.map(e=>byId[e.id]||e);
      ROUNDS[CURRENT].forEach(e=>{
        const st = e.status && e.status.type && e.status.type.state;
        if(st !== 'post') delete cache[e.id];   // ricarica gol/stato delle partite non finite
      });
    }
  }catch(_){}
  if(VIEW !== 'partite' || SELECTED !== CURRENT) return;
  const matches = await Promise.all((ROUNDS[CURRENT]||[]).map(buildMatch));
  render(matches);
  stamp();
}

const CUTS = [17];
const CUTNOTE = "La riga separa le ultime tre posizioni: quelle retrocedono in Serie B.";

/* ---------- viste: partite, classifica, marcatori --------------------------
   La classifica arriva dall'endpoint standings di ESPN (percorso /apis/v2/,
   quello /apis/site/v2/ risponde vuoto). I marcatori si provano da due fonti
   diverse: se nessuna risponde, la vista lo dice invece di restare vuota.
--------------------------------------------------------------------------- */
const LEAGUE = ESPN.split('/').pop();
const V2   = 'https://site.api.espn.com/apis/v2/sports/soccer/'+LEAGUE;
const VIEWS = [['partite','Partite'],['classifica','Classifica'],['marcatori','Marcatori']];
const viewsBar = document.getElementById('views');
let VIEW = 'partite';
const dati = { classifica:null, marcatori:null };

function buildViewBar(){
  viewsBar.innerHTML = VIEWS.map(([k,l]) =>
    `<button class="vbtn${k===VIEW?' sel':''}" onclick="showView('${k}')">${l}</button>`).join('');
}

async function showView(v){
  VIEW = v; buildViewBar();
  roundsBar.style.display = (v==='partite') ? '' : 'none';
  if(v==='partite') return selectRound(SELECTED || CURRENT);
  app.innerHTML = (v==='marcatori')
    ? `<div class="msg"><div class="spin"></div>Conto i gol delle partite giocate… <span id="avanz"></span></div>`
    : `<div class="msg"><div class="spin"></div>Carico…</div>`;
  try{
    if(v==='classifica'){
      if(!dati.classifica) dati.classifica = await loadStandings();
      renderStandings(dati.classifica);
    }else{
      if(!dati.marcatori) dati.marcatori = await loadScorers();
      if(!dati.marcatori.length){ dati.marcatori = null; throw new Error('vuota'); }
      renderScorers(dati.marcatori);
    }
    stamp();
  }catch(_){
    app.innerHTML = `<div class="msg">Dati non disponibili in questo momento.<br>Riprova fra qualche minuto.</div>`;
  }
}

// legge una statistica per nome, provando piu' varianti
function statOf(stats, ...names){
  for(const n of names){
    const s = (stats||[]).find(x => x.name===n || x.abbreviation===n);
    if(s) return (s.displayValue!=null ? s.displayValue : s.value);
  }
  return '';
}

/* ---------- classifica ---------------------------------------------------- */
async function loadStandings(){
  const d = await fetch(V2+'/standings?_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null);
  if(!d) throw new Error('standings');
  const gruppi = [];
  const add = (nome, st) => { if(st && st.entries && st.entries.length) gruppi.push({nome:nome||'', entries:st.entries.slice()}); };
  if(Array.isArray(d.children) && d.children.length) d.children.forEach(c => add(c.name, c.standings));
  else add(d.name, d.standings);
  if(!gruppi.length) throw new Error('standings vuota');
  for(const g of gruppi){
    const pos = e => parseInt(statOf(e.stats,'rank'),10);
    if(g.entries.every(e => Number.isFinite(pos(e)))) g.entries.sort((a,b)=>pos(a)-pos(b));
  }
  return gruppi;
}

function standingsTable(g, unico){
  const taglia = unico && g.entries.length >= 20;
  const righe = g.entries.map((e,i) => {
    const t = e.team || {};
    const logo = t.logo || (t.logos && t.logos[0] && t.logos[0].href) || '';
    const n = i+1;
    const cut = (taglia && CUTS.includes(n)) ? ' class="cut"' : '';
    return `<tr${cut}>
      <td class="pos">${n}</td>
      <td class="l">${logo?`<img class="tlogo" src="${esc(logo)}" alt="" loading="lazy">`:''}${esc(t.shortDisplayName||t.displayName||'')}</td>
      <td class="big">${esc(statOf(e.stats,'points','P'))}</td>
      <td>${esc(statOf(e.stats,'gamesPlayed','GP'))}</td>
      <td>${esc(statOf(e.stats,'pointsFor','goalsFor','GF'))}</td>
      <td>${esc(statOf(e.stats,'pointsAgainst','goalsAgainst','GA'))}</td>
      <td>${esc(statOf(e.stats,'pointDifferential','goalDifference','GD'))}</td>
    </tr>`;
  }).join('');
  return (g.nome && !unico ? `<div class="group-label">${esc(g.nome)}</div>` : '') +
    `<table class="tab">
      <tr><th class="l" colspan="2">Squadra</th><th>Pt</th><th>Giornata</th><th>GF</th><th>GS</th><th>Dif. Reti</th></tr>
      ${righe}
    </table>`;
}

function renderStandings(gruppi){
  const unico = gruppi.length === 1;
  let html = `<div class="roundtitle">Classifica</div>`;
  html += gruppi.map(g => standingsTable(g, unico)).join('');
  if(unico && gruppi[0].entries.length >= 20) html += `<p class="tabnote">${CUTNOTE}</p>`;
  app.innerHTML = html;
}

/* ---------- marcatori -----------------------------------------------------
   Il conto lo facciamo noi, dalle partite della stagione che abbiamo gia'.
   Se il tabellone ESPN porta i marcatori dentro le partite, non serve altro.
   Altrimenti leggiamo il tabellino di ogni partita finita, poche alla volta,
   e teniamo il risultato in memoria per il resto della visita.
--------------------------------------------------------------------------- */
let FONTE = '';

async function loadScorers(){
  const dal = scorersFromEvents();
  if(dal.length){ FONTE = 'tabellone'; return dal; }
  const out = await scorersFromSummaries();
  FONTE = out.length ? 'tabellini' : '';
  return out;
}

function classifica(conta){
  return [...conta.entries()]
    .map(([k,v]) => { const p = k.split('|'); return { player:p.length>2 ? p[1] : p[0], team:p[p.length-1], goals:v }; })
    .sort((a,b) => b.goals - a.goals || a.player.localeCompare(b.player))
    .slice(0,30);
}

// i giocatori di un'azione: ESPN a volte li mette in athletesInvolved,
// a volte in participants, a volte dentro un oggetto athlete
function atletiDi(d){
  return ((d && (d.athletesInvolved || d.participants)) || [])
    .map(x => (x && x.athlete) || x)
    .filter(Boolean);
}

// squadra di chi ha segnato, a partire dall'id squadra dell'azione
function siglaSquadra(comp, teamId){
  const c = (comp.competitors||[]).find(x => String(x.team && x.team.id) === String(teamId));
  return c ? (c.team.abbreviation || c.team.shortDisplayName || '') : '';
}

// gratis: i gol sono gia' dentro le partite scaricate all'avvio. Vale solo se
// li portano quasi tutte, altrimenti il conto sarebbe falso per difetto.
function scorersFromEvents(){
  const conta = new Map();
  let conGol = 0, conDettagli = 0;
  for(const n of Object.keys(ROUNDS)){
    for(const ev of (ROUNDS[n]||[])){
      const c = (ev.competitions||[])[0];
      if(!c) continue;
      const finita = ev.status && ev.status.type && ev.status.type.state !== 'pre';
      const reti = (c.competitors||[]).reduce((s,x)=>s+(parseInt(x.score,10)||0),0);
      const det = c.details || [];
      if(finita && reti > 0){ conGol++; if(det.length) conDettagli++; }
      for(const d of det){
        if(!d.scoringPlay || d.ownGoal || d.shootout) continue;   // fuori autogol e tiri dal dischetto
        const a = atletiDi(d)[0];
        if(!a) continue;
        const nome = a.displayName || a.fullName || a.shortName;
        if(!nome) continue;
        const k = (a.id || nome) + '|' + nome + '|' + siglaSquadra(c, (d.team && d.team.id) || (a.team && a.team.id));
        conta.set(k, (conta.get(k)||0) + 1);
      }
    }
  }
  if(conGol < 5 || conDettagli / conGol < 0.8) return [];
  return classifica(conta);
}

// a mano: un tabellino per partita finita, sei richieste alla volta
async function scorersFromSummaries(){
  const finite = [];
  for(const n of Object.keys(ROUNDS))
    for(const ev of (ROUNDS[n]||[]))
      if(ev.status && ev.status.type && ev.status.type.state === 'post') finite.push(ev);
  if(!finite.length) return [];

  const conta = new Map();
  const coda = finite.slice();
  let fatte = 0;
  const avanza = () => { const el = document.getElementById('avanz'); if(el) el.textContent = fatte + ' / ' + finite.length; };
  avanza();

  const lavora = async () => {
    while(coda.length){
      const ev = coda.shift();
      const comp = ev.competitions[0];
      const casa = comp.competitors.find(c=>c.homeAway==='home') || comp.competitors[0];
      if(!cache[ev.id]){
        const sm = await fetch(ESPN+'/summary?event='+ev.id).then(r=>r.ok?r.json():null).catch(()=>null);
        cache[ev.id] = sm ? extractFromSummary(sm, casa.id) : { events:[], lineups:null };
      }
      for(const e of (cache[ev.id].events || [])){
        if(e.type !== 'goal' && e.type !== 'penalty') continue;   // autogol e cartellini fuori
        const c = comp.competitors.find(x => x.homeAway === e.team) || {};
        const sigla = (c.team && (c.team.abbreviation || c.team.shortDisplayName)) || '';
        const k = e.player + '|' + sigla;
        conta.set(k, (conta.get(k)||0) + 1);
      }
      fatte++; avanza();
    }
  };
  await Promise.all(Array.from({length:6}, lavora));
  return classifica(conta);
}

function renderScorers(list){
  const righe = list.map((s,i) => `<tr>
    <td class="pos">${i+1}</td>
    <td class="l">${boldSurname(s.player)}</td>
    <td class="sq">${esc(s.team||'')}</td>
    <td class="big">${esc(s.goals)}</td>
  </tr>`).join('');
  const nota = 'Conteggio ricavato dalle partite della stagione: rigori inclusi, autogol esclusi.';
  app.innerHTML = `<div class="roundtitle">Marcatori</div>
    <table class="tab">
      <tr><th class="l" colspan="2">Giocatore</th><th class="l">Squadra</th><th>Gol</th></tr>
      ${righe}
    </table>` + (nota ? `<p class="tabnote">${nota}</p>` : '');
}

/* ---------- tema chiaro / scuro ------------------------------------------ */
function applyTheme(scuro){
  document.body.classList.toggle('dark', scuro);
  const b = document.getElementById('theme');
  if(b) b.textContent = scuro ? 'Chiaro' : 'Scuro';
  try{ localStorage.setItem('tema', scuro ? 'scuro' : 'chiaro'); }catch(_){}
}
function toggleTheme(){ applyTheme(!document.body.classList.contains('dark')); }
(function(){
  let scuro = false;
  try{ scuro = localStorage.getItem('tema') === 'scuro'; }catch(_){}
  applyTheme(scuro);   // di default resta chiaro
})();

function stamp(){
  clock.textContent = 'Aggiornato ' + new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

async function start(){
  try{
    await fetchSeason();
  }catch(e){
    errbar.style.display='block';
    errbar.textContent='Non riesco a contattare ESPN. Riprova tra poco.';
    app.innerHTML = `<div class="msg">Impossibile caricare i dati.</div>`;
    return;
  }
  SELECTED = CURRENT;
  buildRoundsBar();
  await selectRound(CURRENT);
  setInterval(refreshCurrent, REFRESH_SECONDS*1000);
}

buildViewBar();
start();
