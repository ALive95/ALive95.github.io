<link rel="preconnect" href="https://fonts.googleapis.com">

:root{
  --carta:#F3F6FC; --inchiostro:#101A33; --grigio:#68738F; --linea:#D6DDEE;
  --accento:#2563C9; --accento-scuro:#0B2265; --card:#FFFFFF;
  --live:#D3382C; --pen:#C79A00; --giallo:#F5C518; --rosso:#D3382C;
  --accento-chiaro:#93B4FF; --testata-tenue:#9CB4E4; --accento-righe:#4C86E8; --fondo-tenue:#EDF1FA;
}
body.dark{--carta:#0B1020;--inchiostro:#E6ECF8;--grigio:#93A0BC;--linea:#222C45;--card:#121A2C;--su-accento:#06101F;--fondo-tenue:#1B2438;--th-fondo:#0E1526}

<body>
<div class="top">
  <header>
    <h1>Tabellone <span>Champions</span></h1>
    <div class="statusbar"><span id="clock">—</span>
      <nav class="switch">
        <button id="theme" onclick="toggleTheme()">Scuro</button>
        <a href="index.html">Serie A</a>
        <a href="champions.html" class="on">Champions</a>
      </nav>
    </div>
  </header>
  <div class="pitchline"></div>
  <nav class="views" id="views"></nav>
  <nav class="rounds" id="rounds"></nav>
</div>
<div id="errbar" class="errbar" style="display:none"></div>

<main id="app">
  <div class="msg"><div class="spin"></div>Carico la stagione…</div>
</main>

<script>
// fase a eliminazione diretta, nell'ordine: [nome, sigla, numero di gare]
const KO_PHASES = [
  ['Playoff','PO',2], ['Ottavi di finale','OTT',2], ['Quarti di finale','QF',2],
  ['Semifinali','SF',2], ['Finale','FIN',1]
];
const LEGS = [['Andata','A'],['Ritorno','R']];
const LEAGUE_PHASE_ROUNDS = 8;   // giornate della fase campionato

// nomi dei turni: 8 giornate di fase campionato, poi playoff/ottavi/quarti/semi/finale
function labelRounds(rounds){
  const out = {}; let md = 0, ko = 0;
  for(const n of Object.keys(rounds).map(Number).sort((a,b)=>a-b)){
    if(ko===0 && md<LEAGUE_PHASE_ROUNDS && rounds[n].length>=10){
      md++; out[n] = {long:'Giornata '+md, short:String(md)}; continue;
    }
    let i = ko, p = 0;
    while(p < KO_PHASES.length && i >= KO_PHASES[p][2]){ i -= KO_PHASES[p][2]; p++; }
    if(p < KO_PHASES.length){
      const leg = KO_PHASES[p][2] > 1 ? LEGS[i] : null;
      out[n] = { long: KO_PHASES[p][0] + (leg?' · '+leg[0]:''),
                 short: KO_PHASES[p][1] + (leg?' '+leg[1]:'') };
    } else {
      out[n] = { long:'Turno '+n, short:String(n) };
    }
    ko++;
  }
  return out;
}

const CONFIG = {
  league: 'uefa.champions',
  query: 'limit=200&',
  fromSeptember: true,
  maxGapDays: 3,           // oltre questo stacco fra due partite inizia un nuovo turno
  expectedRounds: 17,
  padFrom: 8,
  roundName: 'Turno',
  words: { questo:'questo turno', articolo:'il turno' },
  roundTitle: true,
  emptyRoundHtml: 'Sorteggio non ancora effettuato:<br>non si sa ancora chi incontra chi.',
  labelRounds,
  cuts: [8, 24],
  cutNote: "Le prime 8 vanno direttamente agli ottavi, dalla 9 alla 24 ai playoff, dalla 25 in giù sono eliminate. Nel formato attuale non ci sono gironi: la fase campionato è una classifica unica."
};
</script>
<script src="tabellone.js?v=1"></script>
<script data-goatcounter="https://11235.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
